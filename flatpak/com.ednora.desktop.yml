app-id: com.ednora.desktop
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: ednora

finish-args:
  # Display and windowing systems
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  # Hardware accelerated graphics
  - --device=dri
  # Network access for university backend API & Cloudinary assets
  - --share=network
  # Desktop notifications
  - --talk-name=org.freedesktop.Notifications

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
  env:
    CARGO_HOME: /run/build/ednora/cargo
    npm_config_cache: /run/build/ednora/npm-cache

modules:
  - name: ednora
    buildsystem: simple
    build-commands:
      # Install node dependencies and build frontend
      - npm ci || npm install
      - npm run build

      # Build native Tauri Rust binary
      - cargo build --release --manifest-path src-tauri/Cargo.toml

      # Install binary
      - install -Dm755 src-tauri/target/release/ednora /app/bin/ednora

      # Install desktop integration files
      - install -Dm644 flatpak/com.ednora.desktop.desktop /app/share/applications/com.ednora.desktop.desktop
      - install -Dm644 flatpak/com.ednora.desktop.metainfo.xml /app/share/metainfo/com.ednora.desktop.metainfo.xml

      # Install icons in standard FreeDesktop hicolor resolutions
      - install -Dm644 flatpak/icons/32x32.png /app/share/icons/hicolor/32x32/apps/com.ednora.desktop.png
      - install -Dm644 flatpak/icons/64x64.png /app/share/icons/hicolor/64x64/apps/com.ednora.desktop.png
      - install -Dm644 flatpak/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.ednora.desktop.png
      - install -Dm644 flatpak/icons/256x256.png /app/share/icons/hicolor/256x256/apps/com.ednora.desktop.png
      - install -Dm644 flatpak/icons/512x512.png /app/share/icons/hicolor/512x512/apps/com.ednora.desktop.png

    sources:
      - type: dir
        path: ..

